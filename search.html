<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search — CashFlow</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-wallet2"></i> Cashflow
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto gap-1">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="bi bi-list-ul"></i> Transactions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="search.html">
                                <i class="bi bi-search"></i> Search
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="summary.html">
                                <i class="bi bi-bar-chart"></i> Summary
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn-primary-cf ms-2" href="create.html">
                                <i class="bi bi-plus-lg"></i> New Transaction
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mt-page">

            <div class="page-header">
                <h1>Search Transactions</h1>
                <p>
                    Filter by category, type or keyword in the description.
                </p>
            </div>

            <!-- Card with filters -->
            <div class="cf-card mb-4">
                <div class="row g-3 align-items-end">
                    <div class="col-sm-4">
                        <label class="cf-label" for="filter-keyword">Keyword</label>
                        <input
                            type="text"
                            id="filter-keyword"
                            class="cf-input"
                            placeholder="E.g: shopping, gym..."
                        >
                    </div>

                    <div class="col-sm-3">
                        <label class="cf-label" for="filter-category">Category</label>
                        <select id="filter-category" class="cf-select">
                            <option value="">All</option>
                            <option value="FOOD">Food</option>
                            <option value="LEISURE">Leisure</option>
                            <option value="HEALTH">Health</option>
                            <option value="SALARY">Salary</option>
                        </select>
                    </div>

                    <div class="col-sm-3">
                        <label class="cf-label" for="filter-type">Type</label>
                        <select id="filter-type" class="cf-select">
                            <option value="">All</option>
                            <option value="INCOME">Income</option>
                            <option value="EXPENSE">Expense</option>
                        </select>
                    </div>

                    <div class="col-sm-2">
                        <button id="search-btn" class="btn-primary-cf" style="width: 100%; justify-content: center;">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>

                </div>

            </div>

            <!-- Results area -->
            <div class="cf-card">

                <!-- Initial instructions -->
                <div id="initial-state" class="empty-state">
                    <div class="icon">🔍</div>
                    <p>
                        Use the filters above and click on "Search" to find transactions.
                    </p>
                </div>

                <!-- Spinner -->
                <div id="loading-state" class="text-center py-4 d-none">
                    <div class="cf-spinner"></div>
                    <p class="text-muted-cf mt-2" style="font-size:0.85rem;">Searching...</p>
                </div>

                <!-- No results -->
                <div id="empty-state" class="empty-state d-none">
                    <div class="icon">📭</div>
                    <p>No transaction found.</p>
                </div>

                <!-- Results table -->
                <div id="results-wrapper" class="d-none">
                    <!-- Results counter -->
                    <p id="results-count" style="font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1rem;"></p>
                    <div style="overflow-x: auto;">
                        <table class="cf-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Category</th>
                                </tr>
                            </thead>
                            <tbody id="results-tbody"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/search.js"></script>

    </body>
</html>
