<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Transaction - Cashflow</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a href="index.html" class="navbar-brand">
                    <i class="bi bi-wallet2"></i> Cashflow
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto gap-1">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link">
                                <i class="bi bi-list-ul"></i> Transactions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="search.html" class="nav-link">
                                <i class="bi bi-search"></i> Search
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="summary.html" class="nav-link">
                                <i class="bi bi-bar-chart"></i> Summary
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <main class="container mt-page">
            <div class="page-header">
                <a href="index.html" class="btn-secondary-cf mb-3" style="width: fit-content;">
                    <i class="bi bi-arrow-left"></i> Back 
                </a>
                <h1>New Transaction</h1>
                <p>Fill in the data of your transaction.</p>
            </div>
            
            <!-- Card Form -->
            <div class="cf-card" style="max-width: 600px;">
                <!-- The submit is intercepted by JS to avoid page reload -->
                <form id="create-form" novalidate>
                    <div class="mb-4">
                        <label for="description" class="cf-label">Description</label>
                        <input 
                        type="text"
                        id="description"
                        class="cf-input"
                        placeholder="e.g Grocery Shopping"
                        maxlength="255"
                        >
                        <span class="cf-error" id="error-description">The description can not be empty</span>
                    </div>
                    <!-- Grid with two inputs side by side -->
                     <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label for="amount" class="cf-label">Amount</label>
                            <input 
                            type="number"
                            id="amount"
                            class="cf-input"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            >
                            <span class="cf-error" id="error-amount">Fill in a positive value</span>
                        </div>
                        <div class="col-sm-6">
                            <label for="date" class="cf-label">Date</label>
                            <input 
                            type="text"
                            id="date"
                            class="cf-input"
                            onfocus="(this.type='date')"
                            onblur="if(!this.value)this.type='text'"
                            >
                            <span style="font-size: 0.78rem; color: var(--color-text-muted); margin-top: 0.3rem; display: block;">
                                Optional (today by default)
                            </span>
                        </div>
                     </div>
                     <!-- Type and Category -->
                     <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label for="type" class="cf-label">Type</label>
                            <select id="type" class="cf-select">
                                <option value="" disabled selected hidden>Select...</option>
                                <option value="INCOME">Income</option>
                                <option value="EXPENSE">Expense</option>
                            </select>
                            <span class="cf-error" id="error-type">
                                Select a transaction type
                            </span>
                        </div>
                        <div class="col-sm-6">
                            <label for="category" class="cf-label">Category</label>
                            <select id="category" class="cf-select">
                                <option value="" disabled selected hidden>Select...</option>
                                <option value="FOOD">Food</option>
                                <option value="LEISURE">Leisure</option>
                                <option value="HEALTH">Health</option>
                                <option value="SALARY">Salary</option>
                            </select>
                            <span class="cf-error" id="error-category">Select a category</span>
                        </div>
                     </div>

                     <!-- Action buttons -->
                    <div class="d-flex gap-2 justify-content-start">
                        <button type="submit" class="btn-primary-cf" id="submit-btn">
                            <i class="bi bi-check-lg"></i> Register Transaction
                        </button>
                        <a href="index.html" class="btn-secondary-cf">Cancel</a>
                    </div>
                </form>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/create.js"></script>
    </body>
</html>
